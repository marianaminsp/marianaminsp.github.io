<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mariana Minafro Spinelli</title>
<meta name="description" content="Apps and projects by Mariana Minafro Spinelli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
  :root { --bg:#FAFAF7; --panel:#FFFFFF; --line:#E6E5DE; --fg:#1A1C17; --muted:#6B6F66; --accent:#4F6B0A; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0E100C; --panel:#161912; --line:#2A2E24; --fg:#F2F1E6; --muted:#A3AC9C; --accent:#93BC10; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Manrope",system-ui,-apple-system,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  main { max-width:640px; margin:0 auto; padding:88px 20px 64px; }
  h1 { font-family:"Plus Jakarta Sans",sans-serif; font-weight:800; font-size:clamp(34px,7vw,48px); line-height:1.05; letter-spacing:-0.02em; margin:0; }
  .lede { color:var(--muted); font-size:18px; margin:14px 0 0; }
  h2 { margin:56px 0 14px; font-size:12px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); }
  .project { display:flex; align-items:center; gap:16px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:18px; text-decoration:none; color:var(--fg); transition:border-color .15s ease; }
  .project:hover, .project:focus-visible { border-color:var(--accent); }
  .project img { width:56px; height:56px; border-radius:14px; flex-shrink:0; }
  .project strong { display:block; font-size:17px; }
  .project span { color:var(--muted); font-size:15px; }
  footer { margin-top:64px; color:var(--muted); font-size:14px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Mariana Minafro Spinelli</h1>
  <p class="lede">I design and build apps.</p>

  <h2>Projects</h2>
  <a class="project" href="/leafid-app/">
    <img src="/leafid-app/icon.png" alt="">
    <div><strong>LeafID</strong><span>Identify plants and keep a living Herbarium. iOS.</span></div>
  </a>

  <footer><a href="mailto:mariana.minafro@gmail.com">mariana.minafro@gmail.com</a></footer>
</main>
</body>
</html>
